# General
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
set -g allow-passthrough on
setw -g aggressive-resize on
set -g detach-on-destroy off
set -g extended-keys on
set -g extended-keys-format csi-u
set -ag terminal-features "xterm-kitty:extkeys"
set -as terminal-features ",*:clipboard"
set -sg escape-time 10

# Status bar
set -g status-position top
set -g status-interval 5
set -g status-left-length 30
set -g status-right-length 50
set -g window-status-separator ""
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'
set -g set-titles on
set -g set-titles-string '#h:#W'

# Theme
set -g status-style "bg=default,fg=default"
set -g status-left "#[fg=black,bg=blue,bold] #{?client_prefix,P ,#{?#{==:#{pane_mode},copy-mode},Y ,N }}#[fg=brightblack]#[bg=default]"
set -g status-right-length 100
set -g status-right "#[fg=brightblack,bg=default] #h #[fg=black,bg=blue] #S "
set -g window-status-format "#[fg=brightblack] #I:#W "
set -g window-status-current-format "#[fg=blue,bold] #I:#W "
set -g pane-border-style "fg=brightblack"
set -g pane-active-border-style "fg=blue"
set -g message-style "bg=default,fg=blue"
set -g message-command-style "bg=default,fg=blue"
set -g mode-style "bg=blue,fg=black"
setw -g clock-mode-colour blue

# Enable undercurl support (Smulx)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
# Enable colored undercurl support (Setulc) - requires tmux 3.0+
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/{255}%&%d::%p1%{255}%&%d%;m'

# Remap prefix
unbind c-b
set -g prefix c-s
bind -N "Send prefix" c-s send-prefix

# Re-source tmux cofiguration without exiting session
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# Open a samll terminal at the bottom of the current window
bind-key C-t split-window -v -l 15

# Set VI-mode
set-window-option -g mode-keys vi

# Keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

bind "k" display-popup -T "Tmux Sessions (worktree)" -E -w "90%" -h "90%" "sesh_load_worktree"
bind "j" display-popup -T "Tmux Sessions (sesh)" -E -w "90%" -h "90%" "sesh_load"
bind "l" display-popup -d "#{pane_current_path}" -T "lazygit" -E -w "95%" -h "90%" "lazygit -ucd ~/.config/lazygit"
bind "t" display-popup -d "#{pane_current_path}" -T "terminal" -E -w "90%" -h "90%" "fish"
bind "n" display-popup -d "#{pane_current_path}" -T "nushell" -E -w "90%" -h "90%" "nu"
bind "b" display-popup -d "#{pane_current_path}" -T "but tui" -E -w "90%" -h "90%" "but tui"
bind "h" display-popup -d "#{pane_current_path}" -T "dash" -E -w "90%" -h "90%" "gh dash"

# TPM Plugins Setup
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'

run '~/.tmux/plugins/tpm/tpm'
